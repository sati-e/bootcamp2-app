<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Norican&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/Pokeball-PNG-HD-Image.png">
  <title>Busca de Pokémon</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">
    <h1>Pokédex</h1>

    <div class="busca">
      <input
        type="text"
        id="campo-busca"
        placeholder="Digite o nome ou número"
      >

      <button id="botao-buscar" aria-label="Buscar">
      <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
        <path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/>
  </svg>
</button>
    </div>

    <section id="resultado">
      <p>Digite um Pokémon para começar.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
